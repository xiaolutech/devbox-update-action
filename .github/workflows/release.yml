name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Fetch all history + tags so we can compute the previous tag
          # for the changelog comparison link.
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"

          # Idempotent: skip if the release was already created manually
          # for this tag (e.g. the v1.0.1 one we just made).
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          # Point the changelog at the diff vs the previous tag when one exists.
          PREV_TAG="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG_URL="https://github.com/$REPO/compare/$PREV_TAG...$TAG"
          else
            CHANGELOG_URL="https://github.com/$REPO/commits/$TAG"
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --notes "**Full Changelog**: $CHANGELOG_URL"
