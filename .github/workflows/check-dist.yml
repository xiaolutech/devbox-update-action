name: Check dist/

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-dist:
    runs-on: ubuntu-latest
    permissions:
      # needed to push the rebuilt dist/ back onto dependency-update PR branches
      contents: write
      # needed to re-run this job so the rebuilt dist/ gets a passing check
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Check out the PR head branch by name (not by sha) so that when this
          # job re-runs itself after pushing a rebuilt dist/, it picks up the
          # fixed commit instead of looping on the stale sha.
          ref: ${{ github.event.pull_request.head.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the dist/ directory
        run: npm run build

      - name: Compare the expected and actual dist/ directories
        id: diff
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            echo "dist_dirty=true" >> "$GITHUB_OUTPUT"
          fi

      # Renovate (Mend-hosted app) cannot run post-upgrade commands like
      # 'npm run build', so dependency-update PRs arrive with a stale dist/.
      # Rebuild and commit it here. Only runs for PRs from branches in this
      # repository (never from forks).
      - name: Commit rebuilt dist/ on dependency-update PR branches
        if: >-
          steps.diff.outputs.dist_dirty == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # Commit with Renovate's identity so Renovate's isBranchModified
          # check treats this as its own work and automerge still applies.
          git config user.name "renovate[bot]"
          git config user.email "29139614+renovate[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore: rebuild dist"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          echo "dist_rebuilt=true" >> "$GITHUB_OUTPUT"
          sleep 5

      # The push above does not trigger new workflow runs (it uses GITHUB_TOKEN),
      # so re-run this job: it now checks out the updated head branch and passes.
      - name: Re-run check after dist rebuild
        if: >-
          steps.diff.outputs.dist_dirty == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/rerun"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # If index.js was different than expected, upload the expected version as an artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ failure() }}
        with:
          name: dist
          path: dist/
